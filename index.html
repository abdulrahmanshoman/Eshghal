<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1c1c1e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="eshgal">
<title>eshgal</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--tx:#1d1d1f;--mut:#8a8a8e;--bd:#e6e4df;--ac:#b89a55;--band:rgba(184,154,85,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1c1c1e;--tx:#f2f2f3;--mut:#9a9aa0;--bd:#2c2c2f;--band:rgba(184,154,85,.12)}}
:root[data-theme="dark"]{--bg:#141416;--card:#1c1c1e;--tx:#f2f2f3;--mut:#9a9aa0;--bd:#2c2c2f;--band:rgba(184,154,85,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;padding:14px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:15px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font:inherit;color:inherit;background:none;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
.mut{color:var(--mut);font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;align-items:center;gap:8px}.brand img{display:block;width:auto}
.ib{width:38px;height:38px;padding:0;border-radius:50%}.acts{display:flex;gap:8px}
.big{font-size:48px;font-weight:300;line-height:1}.big small{font-size:20px}
.wrap{display:flex;align-items:flex-start;direction:ltr}.sc{overflow-x:auto;flex:1;min-width:0}
table{border-collapse:collapse}
td,th{border:1px solid var(--bd);width:30px;min-width:30px;height:26px;text-align:center;padding:0;font-size:12px}
th.v{height:96px;vertical-align:bottom;padding:2px 0;font-weight:500}
th.v span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:92px;overflow:hidden;white-space:nowrap}
td.n{color:var(--mut)}td.c{cursor:pointer;font-size:15px;color:var(--ac)}td.k{font-weight:700}
tr.td td{background:var(--band)}
svg{flex:none;display:block}
.sr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.sr:last-child{border:0}
.sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dots{display:flex;gap:4px;direction:ltr}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--ac)}
.sv{text-align:end;min-width:74px}.sv b{display:block;font-size:17px}.sv small{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:3px 6px 3px 6px;padding-inline-start:12px;font-size:13px}.chip button{border:0;padding:0 6px}
.f{display:flex;gap:8px}.f select{width:auto;flex:none}
.er{display:flex;gap:6px;margin-top:8px}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;overflow:auto;padding:14px}
.ts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;background:#111;color:#fff;padding:12px;border-radius:12px;z-index:20;text-align:center}
</style></head><body>
